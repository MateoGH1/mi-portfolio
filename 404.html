<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada | Mateo</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo.png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: #0f172a; /* Fondo oscuro y elegante */
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            text-align: center;
        }
        .error-number {
            font-size: 8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        .btn-volver {
            background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-volver:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.4);
            color: white;
        }
    </style>
</head>
<body>

    <div class="container px-4">
        <i class="fa-solid fa-satellite-dish fa-3x mb-4 text-secondary opacity-50"></i>
        <h1 class="error-number">404</h1>
        <h2 class="fw-bold mb-3">¡Oops! Te saliste del mapa</h2>
        <p class="text-secondary mb-5" style="max-width: 500px; margin: 0 auto;">
            La página que estás buscando no existe, fue movida o el enlace es incorrecto. Pero no te preocupes, puedes volver a territorio seguro.
        </p>
        
        <!-- Cambia index.html por el nombre de tu página principal si es diferente -->
        <a href="index.html" class="btn btn-volver text-decoration-none">
            <i class="fa-solid fa-arrow-left me-2"></i> Volver al Inicio
        </a>
    </div>

</body>
</html>
